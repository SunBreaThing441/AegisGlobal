name: Backend CI Pipeline

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Syntax & Module Validation
        run: node -c server.js socketManager.js db.js

      - name: Verify Health Check Endpoint
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 5
          curl -f http://localhost:5000/api/health || exit 1
          kill $SERVER_PID
        env:
          PORT: 5000
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-min-32-chars-long-pipeline
          STRIPE_SECRET_KEY: sk_test_mock_ci_stripe_secret_key_0000000000000000000
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rmfzydycexyuhqskklgu.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Q9yJIk54WyB4jsiBOx2OWQ_ie1YTWBt' }}
